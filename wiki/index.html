<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Обзоры книг</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f6f6f6;

            color: #202122;
            line-height: 1.6;
            font-size: 16px;
        }
        .mw-body {
            max-width: 960px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px 40px;
            border: 1px solid #a7d7f9;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            min-height: 100vh;
        }
        h1 {
            font-family: "Linux Libertine", Georgia, Times, serif;
            font-size: 2.2em;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            margin-bottom: 0.3em;
            padding-bottom: 0.2em;
        }
        h2 {
            font-family: "Linux Libertine", Georgia, Times, serif;
            font-size: 1.6em;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        a {
            color: #0645ad;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        a:visited {
            color: #0b0080;
        }
        .toc {
            background-color: #f8f9fa;
            border: 1px solid #a2a9b1;
            padding: 15px 20px;
            display: inline-block;
            margin: 15px 0 25px 0;
            font-size: 0.95em;
        }
        .toc-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        .toc ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .toc > ul > li {
            margin-bottom: 5px;
        }
        .intro {
            font-size: 1.05em;
            margin-bottom: 20px;
            color: #444;
        }
        .book-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .book-list li {
            margin-bottom: 12px;
            padding: 12px 15px;
            background: #f8f9fa;
            border-left: 4px solid #36c;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .book-list li:hover {
            background: #eaecf0;
        }
        .book-title {
            font-size: 1.15em;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        .book-author {
            font-style: italic;
            color: #54595d;
            display: block;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eaecf0;
            font-size: 0.85em;
            color: #72777d;
        }
    </style>
</head>

<li>

            </li>
<li>
                <a href="Общее\Отцы_и_дети.html" class="book-title">Отцы и дети</a>

            </li>
<li>
                <a href="Общее\Темные_врата.html" class="book-title">Темные врата</a>

                </ul>
            </div>

        <footer>
            Страница сгенерирована автоматически.
